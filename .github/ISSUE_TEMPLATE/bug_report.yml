name: "Bug report / 缺陷反馈"
description: "Report a Windows install, runtime, theme, manager, or restore problem"
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please run `windows/scripts/verify-dream-skin.ps1` first.

        Do not paste API keys, authentication files, private chats, account names, project names, or private local paths.

  - type: input
    id: windows_version
    attributes:
      label: Windows version / Windows 版本
      placeholder: "Windows 11 24H2, build 26100"
    validations:
      required: true

  - type: input
    id: architecture
    attributes:
      label: Architecture / 架构
      placeholder: "x64, ARM64, or x86"
    validations:
      required: true

  - type: input
    id: codex_version
    attributes:
      label: Codex Desktop version / Codex Desktop 版本
      description: Use the Microsoft Store package version when available.
      placeholder: "26.x"
    validations:
      required: true

  - type: input
    id: dream_skin_version
    attributes:
      label: Dream Skin version / 主题工具版本
      placeholder: "v0.3.2 or commit hash"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Problem category / 问题类型
      options:
        - Install or launch / 安装或启动
        - Theme not applied / 主题未应用
        - Layout or readability / 布局或可读性
        - Theme manager / 主题管理器
        - Hot reload or takeover / 热重载或自动接管
        - Port or process diagnostics / 端口或进程诊断
        - Restore / 恢复
        - After a Codex update / Codex 更新后
        - Other / 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: |
        1. Start Codex...
        2. Apply theme...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
    validations:
      required: true

  - type: textarea
    id: verify_output
    attributes:
      label: Sanitized verify output / 已脱敏的验证输出
      description: Paste only relevant lines and remove private data.
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / 截图
      description: Remove private chat, account, project, and path information.
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation / 确认
      options:
        - label: I used the official Microsoft Store Codex app.
          required: true
        - label: I did not paste secrets or private data.
          required: true
        - label: I understand this is an unofficial loopback-CDP theme tool.
          required: true
