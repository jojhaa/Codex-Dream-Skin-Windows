name: "Feature request / 功能建议"
description: "Suggest a Windows theme-manager or runtime improvement"
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is Windows-only. Its scope is external Codex theming through loopback CDP, not API relays or modifications to official application files.

  - type: input
    id: summary
    attributes:
      label: Summary / 一句话概括
      placeholder: "Add..."
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case / 要解决的问题或场景
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 期望方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 考虑过的替代方案
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area / 区域
      options:
        - Native theme manager / 原生主题管理器
        - Theme renderer or CSS / 主题渲染或 CSS
        - Image composition / 图片构图
        - Runtime, hot reload, or takeover / 运行时、热重载或接管
        - Diagnostics or restore / 诊断或恢复
        - Documentation or tests / 文档或测试
        - Other / 其他
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation / 范围确认
      options:
        - label: This request is for Windows.
          required: true
        - label: This request does not require patching Codex binaries, `WindowsApps`, or `app.asar`.
          required: true
